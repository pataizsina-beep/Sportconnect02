
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportConnect — Gym Admin</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <main class="admin-page">
    <header class="admin-header">
      <a class="brand" href="index.html">
        <span class="brand-mark">s.</span>
        <span>sportconnect</span>
      </a>
      <button id="logout-button" class="logout-button" type="button">
        Log out
      </button>
    </header>

    <section class="admin-content">
      <p class="eyebrow">ADMINISTRATION</p>
      <h1 class="admin-title">Gym management</h1>
      <p class="admin-description">
        Manage sports facilities available to the community.
      </p>

      <p id="status" class="message" role="status" aria-live="polite"></p>

      <section class="admin-panel">
        <h2 id="form-title">Add a gym</h2>

        <form id="gym-form">
          <label for="gym-name">Gym name</label>
          <input id="gym-name" required maxlength="150">

          <label for="gym-city">City</label>
          <input id="gym-city" required maxlength="100">

          <label for="gym-street">Street</label>
          <input id="gym-street" maxlength="150">

          <label for="gym-house-number">House number</label>
          <input id="gym-house-number" maxlength="30">

          <label for="gym-sports">Sports offered</label>
          <select id="gym-sports" multiple size="5"></select>
          <p class="hint">Hold Ctrl (Windows) to select multiple sports.</p>

          <div class="form-actions">
            <button class="submit-button" type="submit" id="save-button">
              Add gym
            </button>
            <button class="logout-button" type="button" id="cancel-button" hidden>
              Cancel edit
            </button>
          </div>
        </form>
      </section>

      <section class="gym-list-section">
        <h2>Existing gyms</h2>
        <div id="gym-list" class="gym-list"></div>
      </section>
    </section>
  </main>
</body>
</html>
